# The scripts in bin/legacy predate the package and are kept as they were.
exclude: '^bin/legacy/'
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.9'
    hooks:
      - id: ruff-check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, master]
