[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "pycadu"
dynamic = ["version"]
description = "Satellite-agnostic CCSDS/CADU/VCDU frame handling"
readme = "README.rst"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
  { name = "Martin Raspaud", email = "martin.raspaud@smhi.se" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
# Reading a pass while it is still being received needs to know when the writer
# has finished with the file. Without this the only signal left is the file
# going quiet, which costs an idle timeout at the end of every pass.
watch = [
  "watchdog>=4.0",
]

[project.urls]
Source = "https://github.com/mraspaud/pycadu"
Issues = "https://github.com/mraspaud/pycadu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pycadu"]

[tool.uv]
cache-dir = ".uv-cache"

[dependency-groups]
tests = [
  "pytest>=9.0",
  "pytest-cov",
]
dev = [
  { include-group = "tests" },
  "basedpyright>=1.0",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 120
# The scripts in bin/legacy predate the package and are kept as they were.
extend-exclude = ["bin/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
