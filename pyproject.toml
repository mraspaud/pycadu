[build-system]
requires = [ "hatchling", "hatch-vcs" ]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "pycadu"
dynamic = [ "version" ]
description = "Satellite-agnostic CCSDS/CADU/VCDU frame handling"
readme = "README.rst"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = [ "LICENSE" ]

authors = [ { name = "Martin Raspaud", email = "martin.raspaud@smhi.se" } ]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
]
dependencies = [ "numpy<2.0" ]

[project.urls]
Source = "https://github.com/mraspaud/pycadu"
Issues = "https://github.com/mraspaud/pycadu/issues"

[tool.hatch.build.targets.wheel]
packages = [ "src/pycadu" ]

[tool.uv]
cache-dir = ".uv-cache"

[dependency-groups]
dev = [ "pytest>=9.0", "basedpyright>=1.0", "ruff>=0.9" ]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [ "E", "F", "I", "N", "UP", "RUF" ]
